                        function initializeViewer() {

                            const sanitize = (val) => String(val || "").replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
                            
                            /**
                             * (新增) 检查一个字符串是否是另一个字符串的子序列 (子集)
                             * "ABD" 是 "ABCDE" 的子序列
                             */
                            const isSubsequence = (str1, str2) => {
                                const s1 = String(str1 || "");
                                const s2 = String(str2 || "");

                                if (s1.length === 0) return true;
                                if (s2.length === 0) return false;

                                let shortStr, longStr;
                                if (s1.length < s2.length) {
                                    shortStr = s1;
                                    longStr = s2;
                                } else {
                                    shortStr = s2;
                                    longStr = s1;
                                }
                                
                                let i = 0; // longStr 的指针
                                let j = 0; // shortStr 的指针

                                while (i < longStr.length && j < shortStr.length) {
                                    if (longStr[i] === shortStr[j]) {
                                        j++;
                                    }
                                    i++;
                                }
                                
                                // 如果 j 走完了 shortStr，说明 shortStr 是 longStr 的子序列
                                return j === shortStr.length;
                            };

                            /**
                             * 检查一个行在指定的所有列上是否都为空。
                             */
                            const isRowBlank = (row, cols) => {
                                if (!row) return true; 
                                for (const colIndex of cols) {
                                    const val = row[colIndex];
                                    if (val !== null && val !== undefined && String(val).trim() !== '') {
                                        return false; 
                                    }
                                }
                                return true; 
                            };

                            const checkCanCompare = () => {

                            const autoSizeColumns = (table) => {
                                const headerCells = table.querySelectorAll('thead th');
                                const colgroupCols = table.querySelectorAll('col');
                                if (headerCells.length === 0 || colgroupCols.length === 0) return;

                                colgroupCols.forEach(col => col.style.width = ''); 
                                table.style.width = ''; 

                                table.style.tableLayout = 'auto'; 
                                
                                let totalTableWidth = 0;

                                for (let i = 0; i < headerCells.length; i++) {
                                    const th = headerCells[i];
                                    const col = colgroupCols[i];
                                    
                                    let finalWidth = 50; 

                                    if (i === 0) {
                                        finalWidth = 50;
                                    } else {
                                        const originalWhiteSpace = th.style.whiteSpace;
                                        if (i > 1) {
                                            th.style.whiteSpace = 'nowrap';
                                        }
                                        
                                        const naturalWidth = parseFloat(window.getComputedStyle(th).width);
                                        
                                        if (i > 1) {
                                            th.style.whiteSpace = originalWhiteSpace;
                                        }

                                        finalWidth = Math.max(naturalWidth, 50); 
                                    }
                                    
                                    col.style.width = \`\${finalWidth}px\`;
                                    totalTableWidth += finalWidth;
                                }
                                
                                table.style.width = \`\${totalTableWidth}px\`;
                                table.style.tableLayout = 'fixed'; 
                            };

                            const makeTableResizable = (table) => {

                                    const mouseDownHandler = (e) => {
                                        e.preventDefault();
                                        e.stopPropagation(); 

                                        const colIndex = th.cellIndex;
                                        const colElement = table.querySelectorAll('col')[colIndex];
                                        if (!colElement) return;

                                        const startX = e.pageX;
                                        const startW = parseFloat(colElement.style.width); 

                                        const mouseMoveHandler = (me) => {
                                            me.preventDefault();
                                            
                                            const deltaX = me.pageX - startX;
                                            const newWidth = startW + deltaX;
                                            
                                            if (newWidth > 20) { 
                                                colElement.style.width = newWidth + 'px';
                                            }
                                        };
                                        
                                        const mouseUpHandler = (e) => {
                                            document.removeEventListener('mousemove', mouseMoveHandler);
                                            document.removeEventListener('mouseup', mouseUpHandler);

                                            let newTotalWidth = 0;
                                            table.querySelectorAll('col').forEach(col => {
                                                newTotalWidth += parseFloat(col.style.width);
                                            });
                                            table.style.width = newTotalWidth + 'px';
                                        };
                                        
                                        document.addEventListener('mousemove', mouseMoveHandler);
                                        document.addEventListener('mouseup', mouseUpHandler);
                                    };
                                    
                                    resizer.addEventListener('mousedown', mouseDownHandler);
                                });
                            };
                            
                            // --- 逻辑更新：添加 autoResize 参数 ---

                                            let style = '';

                                    }
                                    formattedData.push(formattedRow);
                                    rawValueData.push(rawRow);
                                }

                                // --- 新增：修剪空白行列的代码 ---

                                // 帮助函数：检查是否为完全空白的行
                                const isRowCompletelyBlank = (row) => {
                                    if (!row || row.length === 0) return true;
                                    // .some 检查是否有任何一个单元格有值
                                    return !row.some(cell => cell !== null && cell !== undefined && String(cell).trim() !== '');
                                };

                                // 1. 从末尾开始修剪空白行
                                let lastNonBlankRow = -1;
                                for (let i = formattedData.length - 1; i >= 0; i--) {
                                    if (!isRowCompletelyBlank(formattedData[i])) {
                                        lastNonBlankRow = i;
                                        break;
                                    }
                                }
                                
                                // (也检查 rawData 以防万一)
                                for (let i = rawValueData.length - 1; i > lastNonBlankRow; i--) {
                                    if (!isRowCompletelyBlank(rawValueData[i])) {
                                        lastNonBlankRow = i;
                                        break;
                                    }
                                }

                                // 裁剪数组
                                formattedData = formattedData.slice(0, lastNonBlankRow + 1);
                                rawValueData = rawValueData.slice(0, lastNonBlankRow + 1);


                                // 2. 查找实际的最大列数
                                let actualMaxCols = 0;
                                for (const row of formattedData) {
                                    if (row) {
                                        // 从后向前查找最后一个有数据的单元格
                                        for (let c = row.length - 1; c >= 0; c--) {
                                            const cell = row[c];
                                            if (cell !== null && cell !== undefined && String(cell).trim() !== '') {
                                                actualMaxCols = Math.max(actualMaxCols, c + 1); // c + 1 是因为索引从0开始
                                                break; // 移动到下一行
                                            }
                                        }
                                    }
                                }
                                
                                // 处理一种特殊情况：数据行全空，但标题行有内容
                                if (formattedData.length > 0 && actualMaxCols === 0) {
                                     if (formattedData[0] && formattedData[0].length > 0) {
                                        actualMaxCols = formattedData[0].length; 
                                        // 再次修剪标题行末尾的空白单元格
                                        for(let c = formattedData[0].length - 1; c >= 0; c--) {
                                            const cell = formattedData[0][c];
                                            if (cell !== null && cell !== undefined && String(cell).trim() !== '') {
                                                actualMaxCols = c + 1;
                                                break;
                                            }
                                        }
                                     }
                                }
                                
                                // --- 修剪代码结束 ---

                                state.fullData = formattedData;
                                state.rawData = rawValueData;
                                state.maxCols = actualMaxCols; // 存储修剪后的列数
                                
                                el.headerRowSelect.innerHTML = '';
                                const rowCount = Math.min(20, state.fullData.length);
                                for(let i = 0; i < rowCount; i++) el.headerRowSelect.add(new Option(\`第 \${i + 1} 行\`, i));
                                el.headerRowSelect.disabled = false;
                                
                                state.selectedHeaderIndex = 0;
                                el.headerRowSelect.value = 0;

                                state.selectedCompareCols = []; 
                                checkCanCompare();
                                
                                renderTable(side); // 默认 autoResize = true
                                updateColumnSelector(side);
                            };
                            
                            const handleFile = (e, side) => {

                            const startComparison = () => {
                                ['1', '2'].forEach(s => {
                                    viewerState[s].highlightedCells.clear();
                                });
                                
                                const state1 = viewerState['1'], state2 = viewerState['2'];
                                const data1 = state1.rawData.slice(state1.selectedHeaderIndex + 1);
                                const data2 = state2.rawData.slice(state2.selectedHeaderIndex + 1);
                                
                                const compareCols1 = state1.selectedCompareCols; // [3, 4]
                                const compareCols2 = state2.selectedCompareCols; // [4, 2]
                                
                                const keyCol1 = 0, keyCol2 = 0;

                                const allCols1 = [keyCol1, ...compareCols1];
                                const allCols2 = [keyCol2, ...compareCols2];

                                /**
                                 * (重载) 为一行高亮所有被比较的单元格
                                 */
                                const addHighlightAll = (side, rowIndex, color) => {
                                    const state = viewerState[side];
                                    const originalRowIndex = state.selectedHeaderIndex + 1 + rowIndex;
                                    if (!state.highlightedCells.has(originalRowIndex)) {
                                        state.highlightedCells.set(originalRowIndex, new Map());
                                    }
                                    const colsToHighlight = (side === '1') ? allCols1 : allCols2;
                                    colsToHighlight.forEach(colIndex => {
                                        state.highlightedCells.get(originalRowIndex).set(colIndex, color);
                                    });
                                };

                                /**
                                 * (新增) 为部分匹配的行逐个单元格高亮
                                 */
                                const addPartialHighlight = (rowIndex1, rowIndex2) => {
                                    const originalRowIndex1 = state1.selectedHeaderIndex + 1 + rowIndex1;
                                    const originalRowIndex2 = state2.selectedHeaderIndex + 1 + rowIndex2;
                                    
                                    if (!state1.highlightedCells.has(originalRowIndex1)) state1.highlightedCells.set(originalRowIndex1, new Map());
                                    if (!state2.highlightedCells.has(originalRowIndex2)) state2.highlightedCells.set(originalRowIndex2, new Map());

                                    const map1 = state1.highlightedCells.get(originalRowIndex1);
                                    const map2 = state2.highlightedCells.get(originalRowIndex2);
                                    const row1 = data1[rowIndex1];
                                    const row2 = data2[rowIndex2];

                                    for (let c = 0; c < allCols1.length; c++) {
                                        const col1 = allCols1[c];
                                        const col2 = allCols2[c];
                                        const val1 = row1[col1];
                                        const val2 = row2[col2];

                                        // 检查是否为第1列 (主键列)
                                        if (col1 === 0) {
                                            // --- 应用新的（绿/黄/红）逻辑 ---
                                            if (val1 === val2) {
                                                map1.set(col1, 'lightGreen');
                                                map2.set(col2, 'lightGreen');
                                            } else if (isSubsequence(val1, val2)) { // 检查子集
                                                map1.set(col1, 'lightYellow');
                                                map2.set(col2, 'lightYellow');
                                            } else {
                                                map1.set(col1, 'lightRed');
                                                map2.set(col2, 'lightRed');
                                            }
                                        } else {
                                            // --- 对所有其他比较列，使用原逻辑 ---
                                            if (val1 === val2) {
                                                map1.set(col1, 'lightGreen'); // 匹配：浅绿
                                                map2.set(col2, 'lightGreen');
                                            } else {
                                                map1.set(col1, 'lightRed'); // 不匹配：浅红
                                                map2.set(col2, 'lightRed');
                                            }
                                        }
                                    }
                                };

                                const claimed1 = new Set();
                                const claimed2 = new Set();
                                const totalComparisons = allCols1.length;

                                data1.forEach((row, i) => {
                                    if (isRowBlank(row, allCols1)) {
                                        claimed1.add(i);
                                    }
                                });
                                data2.forEach((row, j) => {
                                    if (isRowBlank(row, allCols2)) {
                                        claimed2.add(j);
                                    }
                                });

                                // --- Pass 1: Deep Green (Perfect Matches) ---
                                for (let i = 0; i < data1.length; i++) {
                                    if (claimed1.has(i)) continue;
                                    const row1 = data1[i];
                                    
                                    for (let j = 0; j < data2.length; j++) {
                                        if (claimed2.has(j)) continue;
                                        const row2 = data2[j];
                                        
                                        let matches = 0;
                                        for (let c = 0; c < totalComparisons; c++) {
                                            if (row1[allCols1[c]] === row2[allCols2[c]]) {
                                                matches++;
                                            }
                                        }

                                        if (matches === totalComparisons) {
                                            addHighlightAll('1', i, 'deepGreen');
                                            addHighlightAll('2', j, 'deepGreen');
                                            claimed1.add(i);
                                            claimed2.add(j);
                                            break; 
                                        }
                                    }
                                }

                                // --- Pass 2: Light Red/Green (Partial Matches) ---
                                for (let i = 0; i < data1.length; i++) {
                                    if (claimed1.has(i)) continue; 
                                    const row1 = data1[i];
                                    
                                    for (let j = 0; j < data2.length; j++) {
                                        if (claimed2.has(j)) continue; 
                                        const row2 = data2[j];
                                        
                                        let matches = 0;
                                        for (let c = 0; c < totalComparisons; c++) {
                                            if (row1[allCols1[c]] === row2[allCols2[c]]) {
                                                matches++;
                                            }
                                        }

                                        if (matches > 0) { 
                                            addPartialHighlight(i, j);
                                            claimed1.add(i);
                                            claimed2.add(j);
                                            break; 
                                        }
                                    }
                                }

                                // --- Pass 3: Deep Red (No Matches) ---
                                for (let i = 0; i < data1.length; i++) {
                                    if (!claimed1.has(i)) {
                                        addHighlightAll('1', i, 'deepRed');
                                    }
                                }
                                for (let j = 0; j < data2.length; j++) {
                                    if (!claimed2.has(j)) {
                                        addHighlightAll('2', j, 'deepRed');
                                    }
                                }

                                // --- 逻辑更新：调用时不自动调整列宽 ---
                                renderTable('1', false);
                                renderTable('2', false);
                            };
                            
                            const handleCustomCopy = (event) => {

                                if (!selection.rangeCount || selection.isCollapsed) return;
                            
                                event.preventDefault();
                                event.stopImmediatePropagation();
                            
                                const range = selection.getRangeAt(0);
                                const savedRange = range.cloneRange();
                            
                                const container = currentDoc.createElement('div');
                                container.appendChild(range.cloneContents());
                            
                                let textToCopy;
                                const tableRows = container.querySelectorAll('tr');
                                if (tableRows.length > 0) {
                                    const rows = [];
                                    tableRows.forEach(tr => {
                                        const cells = [];
                                        tr.querySelectorAll('th, td').forEach(cell => {
                                            cells.push(cell.textContent);
                                        });
                                        rows.push(cells.join('\\t')); 
                                    });
                                    textToCopy = rows.join('\\n'); 
                                } else {
                                    textToCopy = selection.toString(); 
                                }
                            
                                const textArea = currentDoc.createElement('textarea');
                                textArea.value = textToCopy;
                                textArea.style.position = 'fixed';
                                textArea.style.top = '-9999px';
                                textArea.style.left = '-9999px';
                                currentDoc.body.appendChild(textArea);
                                textArea.focus();
                                textArea.select();
                                try {
                                    const successful = currentDoc.execCommand('copy');
                                    if (!successful) {
                                       console.error('execCommand was not successful');
                                    }
                                } catch (err) {
                                    console.error('无法复制: ', err);
                                }
                                currentDoc.body.removeChild(textArea);

                                selection.removeAllRanges();
                                selection.addRange(savedRange);
                            };

                            const createSheetSelectListener = (side) => {
                                return (e) => {
                                    loadSheetData(side, e.target.value);
                                    if (!linkState.sheetLinked) {
                                        const otherSide = side === '1' ? '2' : '1'; 
                                        if (viewerState[otherSide].workbook) {
                                            const otherSelect = elements[otherSide].sheetSelect;
                                            if (e.target.selectedIndex < otherSelect.options.length) {
                                                otherSelect.selectedIndex = e.target.selectedIndex;
                                                loadSheetData(otherSide, otherSelect.value);
                                            }
                                        }
                                        linkState.sheetLinked = true;
                                    }
                                };
                            };

                            const createHeaderRowSelectListener = (side) => {
                                return (e) => {
                                    const selectedIndex = e.target.selectedIndex;
                                    viewerState[side].selectedHeaderIndex = parseInt(e.target.value, 10);
                                    
                                    viewerState[side].selectedCompareCols = [];
                                    checkCanCompare();

                                    renderTable(side); // 默认 autoResize = true
                                    updateColumnSelector(side); 

                                    if (!linkState.headerLinked) {
                                        const otherSide = side === '1' ? '2' : '1'; 
                                        if (viewerState[otherSide].fullData) {
                                            const otherSelect = elements[otherSide].headerRowSelect;
                                            if (selectedIndex < otherSelect.options.length) {
                                                otherSelect.selectedIndex = selectedIndex;
                                                viewerState[otherSide].selectedHeaderIndex = parseInt(otherSelect.value, 10);
                                                
                                                viewerState[otherSide].selectedCompareCols = [];
                                                checkCanCompare();

                                                renderTable(otherSide); // 默认 autoResize = true
                                                updateColumnSelector(otherSide);
                                            }
                                        }
                                        linkState.headerLinked = true;
                                    }
                                };
                            };

                            /**
                             * 设置自定义下拉框的打开/关闭逻辑
                             */
                            const setupDropdownToggle = (side) => {
                                const el = elements[side];
                                el.compareColButton.addEventListener('click', (e) => {
                                    e.stopPropagation(); 
                                    
                                    const otherSide = side === '1' ? '2' : '1';
                                    const otherEl = elements[otherSide];

                                    otherEl.compareColDropdown.classList.add('hidden');
                                    el.compareColDropdown.classList.toggle('hidden');
                                });
                            };

                            /**
                             * 全局点击监听器，用于关闭所有打开的下拉框
                             */
                            document.addEventListener('click', () => {
                                if (elements['1'] && elements['1'].compareColDropdown) {
                                    elements['1'].compareColDropdown.classList.add('hidden');
                                }
                                if (elements['2'] && elements['2'].compareColDropdown) {
                                    elements['2'].compareColDropdown.classList.add('hidden');
                                }
                            });


                            ['1', '2'].forEach(side => {
                                const el = elements[side];
                                el.fileUpload.addEventListener('change', (e) => handleFile(e, side));
                                el.sheetSelect.addEventListener('change', createSheetSelectListener(side));
                                el.headerRowSelect.addEventListener('change', createHeaderRowSelectListener(side));
                                setupDropdownToggle(side);
                                el.tableOutput.addEventListener('copy', handleCustomCopy);
                            });
                            
                            elements.compareButton.addEventListener('click', startComparison);

                            const syncScroll = (source, target, state) => {
                                if (isSyncingScroll) return;
                                isSyncingScroll = true;
                                
                                const delta = source.scrollTop - state.lastScrollTop;
                                target.scrollTop += delta;
                                
                                viewerState['1'].lastScrollTop = elements['1'].tableOutput.scrollTop;
                                viewerState['2'].lastScrollTop = elements['2'].tableOutput.scrollTop;
                                
                                requestAnimationFrame(() => {
                                    isSyncingScroll = false;
                                });
                            };

                            const scrollHandler1 = () => {
                                if (elements.scrollLock.checked) {
                                    syncScroll(elements['1'].tableOutput, elements['2'].tableOutput, viewerState['1']);
                                }
                                viewerState['1'].lastScrollTop = elements['1'].tableOutput.scrollTop;
                            };
                            const scrollHandler2 = () => {
                                if (elements.scrollLock.checked) {
                                    syncScroll(elements['2'].tableOutput, elements['1'].tableOutput, viewerState['2']);
                                }
                                viewerState['2'].lastScrollTop = elements['2'].tableOutput.scrollTop;
                            };

                            elements['1'].tableOutput.addEventListener('scroll', scrollHandler1);
                            elements['2'].tableOutput.addEventListener('scroll', scrollHandler2);

                            let resizeTimer;
                            const debouncedResizeHandler = () => {
                                clearTimeout(resizeTimer);
                                resizeTimer = setTimeout(() => {
                                    ['1', '2'].forEach(side => {
                                        const table = elements[side].tableOutput.querySelector('table');
                                        if (table) {
                                            autoSizeColumns(table);
                                        }
                                    });
                                }, 200); 
                            };
                            window.addEventListener('resize', debouncedResizeHandler);
                        }
                        
                        initializeViewer();
