<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pyodide CDN -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 font-sans">
    <div class="min-h-screen flex items-center justify-center p-8">
        <div class="max-w-2xl w-full">
            <div class="bg-white rounded-2xl shadow-2xl p-8">
                <h1 class="text-4xl font-bold text-gray-800 mb-2 text-center">Temperature Converter</h1>
                <p class="text-gray-600 text-center mb-8">Convert between Fahrenheit and Celsius</p>
                
                <div id="loading-indicator" class="text-center text-gray-500 mb-4 hidden">
                    <p>Loading Pyodide...</p>
                </div>
                
                <div class="space-y-6">
                    <div>
                        <label for="celsius-input" class="block text-sm font-semibold text-gray-700 mb-2">
                            Celsius (°C)
                        </label>
                        <input 
                            type="number" 
                            id="celsius-input" 
                            placeholder="Enter temperature in Celsius"
                            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-teal-500 focus:outline-none transition text-lg"
                        />
                    </div>
                    
                    <div class="flex justify-center">
                        <button 
                            id="convert-btn" 
                            class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-8 rounded-lg text-lg transition duration-300 shadow-lg hover:shadow-xl transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed"
                            disabled
                        >
                            Convert
                        </button>
                    </div>
                    
                    <div>
                        <label for="fahrenheit-input" class="block text-sm font-semibold text-gray-700 mb-2">
                            Fahrenheit (°F)
                        </label>
                        <input 
                            type="number" 
                            id="fahrenheit-input" 
                            placeholder="Enter temperature in Fahrenheit"
                            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-teal-500 focus:outline-none transition text-lg"
                        />
                    </div>
                    
                    <div id="result-display" class="mt-6 p-4 bg-teal-50 border-2 border-teal-200 rounded-lg hidden">
                        <p id="result-text" class="text-gray-800 font-medium text-center"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let pyodide;
        let lastModified = null;
        
        // Initialize Pyodide
        async function main() {
            const loadingIndicator = document.getElementById('loading-indicator');
            const convertBtn = document.getElementById('convert-btn');
            
            loadingIndicator.classList.remove('hidden');
            
            try {
                pyodide = await loadPyodide();
                
                // Install pandas
                await pyodide.loadPackage("pandas");
                
                // Load Python code from external file
                const pythonCodeResponse = await fetch('./temperature_converter.py');
                const pythonCode = await pythonCodeResponse.text();
                
                // Execute Python code
                pyodide.runPython(pythonCode);
                
                // Enable convert button
                convertBtn.disabled = false;
                loadingIndicator.classList.add('hidden');
                
                // Set up event listeners
                setupEventListeners();
                
            } catch (error) {
                console.error('Error loading Pyodide:', error);
                loadingIndicator.textContent = 'Error loading Pyodide. Please refresh the page.';
            }
        }
        
        function setupEventListeners() {
            const celsiusInput = document.getElementById('celsius-input');
            const fahrenheitInput = document.getElementById('fahrenheit-input');
            const convertBtn = document.getElementById('convert-btn');
            
            // Track which input was last modified
            celsiusInput.addEventListener('input', () => {
                lastModified = 'celsius';
                pyodide.runPython(`last_modified = 'celsius'`);
            });
            
            fahrenheitInput.addEventListener('input', () => {
                lastModified = 'fahrenheit';
                pyodide.runPython(`last_modified = 'fahrenheit'`);
            });
            
            // Convert button click handler
            convertBtn.addEventListener('click', () => {
                convertTemperature();
            });
            
            // Enter key handlers
            celsiusInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    convertTemperature();
                }
            });
            
            fahrenheitInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    convertTemperature();
                }
            });
        }
        
        function convertTemperature() {
            const resultDisplay = document.getElementById('result-display');
            const resultText = document.getElementById('result-text');
            
            // Hide result display initially
            resultDisplay.classList.add('hidden');
            
            try {
                // Get input values and perform conversion using Python
                // Store result in js module for JavaScript access
                pyodide.runPython(`
# Get input values
celsius_val = get_input_value('celsius-input')
fahrenheit_val = get_input_value('fahrenheit-input')

# Perform conversion
result = convert_temperature(celsius_val, fahrenheit_val, last_modified)

# Store result in js module for JavaScript access
js.conversion_result = result
                `);
                
                // Get result from js module
                const result = pyodide.globals.get('js').conversion_result.toJs({
                    dict_converter: Object.fromEntries
                });
                
                if (result.success) {
                    // Update the target input field using Python
                    pyodide.runPython(`
set_input_value('${result.target_id}', js.conversion_result['converted_value'])
                    `);
                    
                    // Update result display
                    resultText.textContent = result.result_text;
                    resultDisplay.classList.remove('hidden');
                    
                    // Update last modified
                    lastModified = result.last_modified;
                    pyodide.runPython(`last_modified = '${result.last_modified}'`);
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('Error during conversion:', error);
                alert('An error occurred during conversion. Please try again.');
            }
        }
        
        // Start loading Pyodide when page loads
        main();
    </script>
</body>
</html>
