<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp Testing - Launcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Launcher Interface -->
    <div id="launcher-container" class="flex items-center justify-center h-full">
        <div class="text-center p-8 bg-white rounded-xl shadow-lg">
            <h1 class="text-3xl font-bold text-gray-800 mb-4">Temp Testing</h1>
            <p class="text-gray-600 mb-6">A temporary testing tool for quick testing and validation of features.</p>
            <button id="launch-button" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-6 rounded-lg text-lg transition duration-300 shadow-md hover:shadow-lg">
                Launch Testing Tool
            </button>
            <p id="launcher-error" class="text-red-500 text-sm mt-4 hidden"></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const launchButton = document.getElementById('launch-button');
            const launcherError = document.getElementById('launcher-error');
            
            if (!launchButton) {
                console.error('Launch button not found');
                return;
            }
            
            launchButton.addEventListener('click', () => {
                launcherError.classList.add('hidden');
                
                // Get available screen width and height
                const width = screen.availWidth;
                const height = screen.availHeight;
                
                // Open a new window and load converter.html
                const testWindow = window.open('./converter.html', 'TempTesting', `resizable=yes,scrollbars=yes,width=${width},height=${height},top=0,left=0`);

                if (!testWindow) {
                    launcherError.textContent = 'Unable to open new window. Please check browser popup settings.';
                    launcherError.classList.remove('hidden');
                }
            });
        });
    </script>

</body>
</html>
